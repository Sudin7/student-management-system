{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Students Directory</title>


<link rel="stylesheet" href="{% static 'css/styles.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">


</head>
<body>
    <h2>Student Details</h2>
    <p>Student Name={{student.full_name}}</p>
    <img src={{student.image.url}} alt="Student Image" width="200" height="200">
    <p>Student Age={{student.age}}</p>
    <p>Student Semester={{student.semester}}</p>
    <p>Student Degree={{student.degree_name}}</p>
    <p>Student Graduated={{student.is_graduated}}</p>
</body>
</html>
