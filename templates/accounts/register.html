{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Students Directory</title>


<link rel="stylesheet" href="{% static 'css/styles.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" >
  

</head>
<body>
    <h2 class="text-center">Register</h2>
    <form action="{%url 'register' %}" method="POST" style="text-align:left; width:500px;margin:auto">
        {% csrf_token %}
        {{ form | crispy }}
        <button type='submit'>Register</button>
    </form>
</body>
</html>
